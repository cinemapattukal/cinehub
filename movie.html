
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CineHub - Movie Details</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;background:#100d0d;color:#fff;
  font-family:Arial,sans-serif;
}
header{
  padding:18px 5%;background:#181818;
  border-bottom:1px solid #303030;
}
header h1{margin:0;color:#1ed760}
header a{color:inherit;text-decoration:none}
main{
  max-width:850px;margin:auto;padding:28px 22px 45px;
  text-align:center;
}
.back{
  display:block;text-align:left;margin-bottom:25px;
  color:#1ed760;text-decoration:none;
}
.poster{
  display:block;width:min(100%,360px);
  aspect-ratio:2/3;object-fit:cover;
  border-radius:16px;margin:0 auto 28px;
  background:#222;
}
.eyebrow{
  color:#aaa;letter-spacing:3px;
  font-size:13px;margin:10px 0;
}
h2{font-size:clamp(27px,5vw,42px);margin:12px 0}
.meta{color:#aaa;font-size:18px;margin:15px 0 28px}
.director{color:#ddd;font-size:17px;margin:10px 0 30px}
.button{
  display:block;width:100%;padding:19px 14px;
  margin:14px 0;border-radius:18px;
  font-size:19px;font-weight:bold;
  text-decoration:none;border:0;
}
.download{background:#f5f5f5;color:#111}
.disabled{background:#262626;color:#888}
.section{margin-top:35px;text-align:left}
.section h3{font-size:23px}
.cast{
  display:grid;grid-template-columns:repeat(3,minmax(0,1fr));
  gap:16px;
}
.person img{
  width:100%;aspect-ratio:2/3;object-fit:cover;
  border-radius:10px;background:#292929;
}
.person p{font-size:14px;margin:7px 0;color:#eee}
#status{color:#aaa}
@media(min-width:600px){
  .cast{grid-template-columns:repeat(5,minmax(0,1fr))}
}
</style>
</head>
<body>
<header><h1><a href="./">CineHub</a></h1></header>

<main>
<a class="back" href="./">← Back to Movies</a>
<p id="status"></p>

<div id="content" hidden>
  <img id="poster" class="poster" alt="Movie poster">
  <div class="eyebrow">MOVIE</div>
  <h2 id="title"></h2>
  <div id="year" class="meta"></div>
  <div id="director" class="director"></div>

  <a id="download" class="button download" hidden
     target="_blank" rel="noopener">
    ↓ &nbsp; Download ZIP
  </a>
  <div id="noDownload" class="button disabled">
    Download ZIP link not added
  </div>

  <section class="section" id="castSection" hidden>
    <h3>Cast</h3>
    <div id="cast" class="cast"></div>
  </section>
</div>
</main>

<script type="module">
import {initializeApp}
from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";
import {
  getFirestore,doc,getDoc
} from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";

const firebaseConfig={
  apiKey:"AIzaSyB96qkeFLXWMIMvld9jS9SOmbx2g2sJ98",
  authDomain:"cinehub-27129.firebaseapp.com",
  projectId:"cinehub-27129",
  storageBucket:"cinehub-27129.firebasestorage.app",
  messagingSenderId:"564236433071",
  appId:"1:564236433071:web:474301819e114c22bac65a"
};

/* Add your own TMDB API key here to load cast photos */
const TMDB_API_KEY="2851b0a195ccff91a13b27dab86418c4";

const db=getFirestore(initializeApp(firebaseConfig));
const $=id=>document.getElementById(id);
const params=new URLSearchParams(location.search);
const movieId=params.get("id");
const CACHE_PREFIX="cinehub_detail_v1_";

function text(id,value){
  $(id).textContent=value||"";
}

function safeUrl(value){
  try{
    const u=new URL(value);
    return u.protocol==="https:" ? u.href : "";
  }catch{return "";}
}

function showMovie(movie){
  text("title",movie.title||"Movie");
  text("year",movie.year||movie.releaseDate||"");
  text("director",movie.director?"Director: "+movie.director:"");

  if(movie.poster){
    $("poster").src=movie.poster;
    $("poster").hidden=false;
  }else{
    $("poster").hidden=true;
  }

  const zip=safeUrl(movie.downloadZip||movie.zipUrl||"");
  $("download").hidden=!zip;
  $("download").href=zip;
  $("noDownload").hidden=!!zip;

  $("content").hidden=false;
  $("status").textContent="";
}

function renderCast(people){
  const cast=$("cast");
  cast.replaceChildren();
  let count=0;

  (people||[]).forEach(person=>{
    const name=typeof person==="string"?person:person.name;
    if(!name)return;

    const item=document.createElement("div");
    item.className="person";

    const img=document.createElement("img");
    img.alt=name;
    img.loading="lazy";
    const profile=typeof person==="object"?person.profilePath||person.profile_path:"";

    if(profile){
      img.src=profile.startsWith("http")
        ? profile
        : "https://image.tmdb.org/t/p/w185"+profile;
    }else{
      img.hidden=true;
    }

    const label=document.createElement("p");
    label.textContent=name;
    item.append(img,label);
    cast.append(item);
    count++;
  });

  $("castSection").hidden=count===0;
}

async function loadCast(movie){
  if(!movie.tmdbId ||
     !TMDB_API_KEY ||
     TMDB_API_KEY==="PASTE_YOUR_TMDB_API_KEY_HERE"){
    renderCast(movie.cast||[]);
    return;
  }

  try{
    const response=await fetch(
      "https://api.themoviedb.org/3/movie/"+
      encodeURIComponent(movie.tmdbId)+
      "/credits?api_key="+encodeURIComponent(TMDB_API_KEY)
    );

    if(!response.ok)throw new Error("TMDB credits failed");

    const data=await response.json();
    const people=(data.cast||[]).slice(0,15).map(p=>({
      name:p.name,
      profilePath:p.profile_path
        ? "https://image.tmdb.org/t/p/w185"+p.profile_path
        : ""
    }));

    renderCast(people);
  }catch(error){
    console.error(error);
    renderCast(movie.cast||[]);
  }
}

async function loadMovie(){
  if(!movieId){
    $("status").textContent="Movie ID is missing.";
    return;
  }

  /* Display previously cached details immediately */
  try{
    const cached=localStorage.getItem(CACHE_PREFIX+movieId);
    if(cached)showMovie(JSON.parse(cached));
  }catch(error){}

  try{
    const snapshot=await getDoc(doc(db,"movies",movieId));

    if(!snapshot.exists()){
      if($("content").hidden){
        $("status").textContent="Movie not found.";
      }
      return;
    }

    const movie={
      ...snapshot.data(),
      documentId:snapshot.id
    };

    localStorage.setItem(CACHE_PREFIX+movieId,JSON.stringify(movie));
    showMovie(movie);
    await loadCast(movie);

  }catch(error){
    console.error(error);
    if($("content").hidden){
      $("status").textContent=
        "Could not load movie. Check your internet connection and Firestore rules.";
    }
  }
}

loadMovie();
</script>
</body>
</html>
