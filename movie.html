
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Movie Details - CineHub</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#101010;color:#fff;font-family:Arial,sans-serif}
header{padding:18px 5%;background:#181818;border-bottom:1px solid #303030}
header h1{margin:0;color:#1ed760}
header a{color:inherit;text-decoration:none}
main{max-width:1100px;margin:auto;padding:20px 5%}
.back{display:inline-block;color:#1ed760;text-decoration:none;margin-bottom:20px}
.hero{display:grid;grid-template-columns:minmax(120px,280px) 1fr;gap:22px;align-items:start}
.poster{width:100%;border-radius:10px;background:#222}
h2{margin:0 0 10px;font-size:28px}
.meta{color:#bbb;margin:10px 0}
.rating{color:#1ed760;font-weight:bold}
.overview{line-height:1.7;color:#ddd}
.section{margin-top:30px}
.cast{display:flex;flex-wrap:wrap;gap:8px}
.person{background:#222;padding:9px 12px;border-radius:7px;font-size:14px}
.trailer{width:100%;aspect-ratio:16/9;border:0;border-radius:10px}
#status{color:#bbb}
@media(max-width:500px){
 .hero{grid-template-columns:120px minmax(0,1fr);gap:14px}
 h2{font-size:21px}
 main{padding:18px 4%}
}
</style>
</head>
<body>
<header><h1><a href="./">CineHub</a></h1></header>
<main>
<a class="back" href="./">← Back to Movies</a>
<p id="status">Loading movie details...</p>
<div id="content" hidden>
  <section class="hero">
    <img id="poster" class="poster" alt="Movie poster">
    <div>
      <h2 id="title"></h2>
      <div id="year" class="meta"></div>
      <div id="rating" class="rating"></div>
      <p id="director" class="meta"></p>
    </div>
  </section>

  <section class="section">
    <h3>Overview</h3>
    <p id="overview" class="overview"></p>
  </section>

  <section class="section">
    <h3>Cast</h3>
    <div id="cast" class="cast"></div>
  </section>

  <section id="trailerSection" class="section" hidden>
    <h3>Trailer</h3>
    <iframe id="trailer" class="trailer"
      title="Movie trailer"
      allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
      allowfullscreen></iframe>
  </section>
</div>
</main>

<script type="module">
import {initializeApp}
from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";
import {
  getFirestore, doc, getDoc
} from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";

const firebaseConfig={
  apiKey:"AIzaSyB96qkeFLXWMIMvld9jS9SOmbx2g2sJ98",
  authDomain:"cinehub-27129.firebaseapp.com",
  projectId:"cinehub-27129",
  storageBucket:"cinehub-27129.firebasestorage.app",
  messagingSenderId:"564236433071",
  appId:"1:564236433071:web:474301819e114c22bac65a"
};

const db=getFirestore(initializeApp(firebaseConfig));
const status=document.getElementById("status");
const content=document.getElementById("content");

function showText(id,value){
  document.getElementById(id).textContent=value||"";
}

async function loadMovie(){
  const params=new URLSearchParams(location.search);
  const id=params.get("id");

  if(!id){
    status.textContent="Movie ID is missing.";
    return;
  }

  try{
    const snapshot=await getDoc(doc(db,"movies",id));

    if(!snapshot.exists()){
      status.textContent="Movie not found.";
      return;
    }

    const movie=snapshot.data();

    document.title=(movie.title||"Movie")+" - CineHub";
    showText("title",movie.title);
    showText("year",movie.year||movie.releaseDate);
    showText("rating",movie.rating
      ? "★ "+Number(movie.rating).toFixed(1)+"/10" : "");
    showText("director",movie.director
      ? "Director: "+movie.director : "");
    showText("overview",movie.overview||"No overview available.");

    const poster=document.getElementById("poster");
    if(movie.poster){
      poster.src=movie.poster;
    }else{
      poster.hidden=true;
    }

    const cast=document.getElementById("cast");
    cast.replaceChildren();

    (Array.isArray(movie.cast)?movie.cast:[]).forEach(name=>{
      const person=document.createElement("span");
      person.className="person";
      person.textContent=name;
      cast.appendChild(person);
    });

    /* Show trailer only if a valid YouTube URL was saved */
    if(movie.trailerUrl){
      try{
        const url=new URL(movie.trailerUrl);
        let videoId="";

        if(url.hostname==="youtu.be"){
          videoId=url.pathname.slice(1);
        }else if(
          ["youtube.com","www.youtube.com","m.youtube.com"].includes(url.hostname)
        ){
          if(url.pathname==="/watch"){
            videoId=url.searchParams.get("v")||"";
          }else if(url.pathname.startsWith("/embed/")){
            videoId=url.pathname.split("/")[2]||"";
          }else if(url.pathname.startsWith("/shorts/")){
            videoId=url.pathname.split("/")[2]||"";
          }
        }

        if(/^[A-Za-z0-9_-]{11}$/.test(videoId)){
          document.getElementById("trailer").src=
            "https://www.youtube-nocookie.com/embed/"+videoId;
          document.getElementById("trailerSection").hidden=false;
        }
      }catch(error){
        console.warn("Invalid trailer URL",error);
      }
    }

    status.hidden=true;
    content.hidden=false;
  }catch(error){
    console.error(error);
    status.textContent=
      "Could not load movie details. Check Firestore read permissions.";
  }
}

loadMovie();
</script>
</body>
</html>
