
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CineHub - Movie Details</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  background:#100d0d;
  color:#fff;
  font-family:Arial,sans-serif;
}

header{
  padding:18px 5%;
  background:#181818;
  border-bottom:1px solid #303030;
}

header h1{
  margin:0;
  color:#1ed760;
}

header a{
  color:inherit;
  text-decoration:none;
}

main{
  max-width:850px;
  margin:auto;
  padding:28px 22px 45px;
  text-align:center;
}

.back{
  display:block;
  text-align:left;
  margin-bottom:25px;
  color:#1ed760;
  text-decoration:none;
}

.poster{
  display:block;
  width:min(100%,360px);
  aspect-ratio:2/3;
  object-fit:cover;
  border-radius:16px;
  margin:0 auto 28px;
  background:#222;
}

.eyebrow{
  color:#aaa;
  letter-spacing:3px;
  font-size:13px;
  margin:10px 0;
}

h2{
  font-size:clamp(27px,5vw,42px);
  line-height:1.12;
  margin:12px 0;
}

.meta{
  color:#aaa;
  font-size:18px;
  line-height:1.6;
  margin:15px 0 28px;
}

.director{
  color:#ddd;
  font-size:17px;
  margin:10px 0 30px;
}

.button{
  display:block;
  width:100%;
  padding:19px 14px;
  margin:14px 0;
  border-radius:18px;
  font-size:19px;
  font-weight:bold;
  text-decoration:none;
  border:0;
}

.download{
  background:#f5f5f5;
  color:#111;
}

.disabled{
  background:#262626;
  color:#888;
}

.section{
  margin-top:35px;
  text-align:left;
}

.section h3{
  font-size:23px;
  margin-bottom:18px;
}

/* Horizontal Cast Slider */
.cast{
  display:flex;
  flex-wrap:nowrap;
  gap:14px;
  overflow-x:auto;
  overflow-y:hidden;
  scroll-snap-type:x mandatory;
  -webkit-overflow-scrolling:touch;
  padding:4px 2px 14px;
}

.person{
  flex:0 0 112px;
  min-width:0;
  scroll-snap-align:start;
}

.person img{
  display:block;
  width:100%;
  aspect-ratio:2/3;
  object-fit:cover;
  border-radius:10px;
  background:#292929;
}

.person p{
  font-size:13px;
  line-height:1.4;
  overflow-wrap:anywhere;
  margin:7px 0;
}

.cast::-webkit-scrollbar{
  height:4px;
}

.cast::-webkit-scrollbar-thumb{
  background:#444;
  border-radius:10px;
}

/* Phone layout */
@media(max-width:599px){
  main{
    max-width:100%;
    padding:24px 20px 40px;
    text-align:center;
  }

  .back{text-align:left}

  .poster{
    width:min(100%,340px);
    margin:0 auto 28px;
    border-radius:16px;
  }

  .eyebrow{margin-top:12px}

  h2{font-size:36px}

  .meta{font-size:18px}

  .director{font-size:17px}

  .button{
    width:100%;
    padding:20px 14px;
    border-radius:18px;
  }

  .section{text-align:left}

  .person{flex-basis:105px}
}
</style>
</head>

<body>

<header>
  <h1><a href="./">CineHub</a></h1>
</header>

<main>
  <a class="back" href="./">← Back to Movies</a>

  <p id="status"></p>

  <div id="content" hidden>
    <img id="poster" class="poster" alt="Movie poster">

    <div class="eyebrow">MOVIE</div>
    <h2 id="title"></h2>
    <div id="year" class="meta"></div>
    <div id="director" class="director"></div>

    <a id="download" class="button download"
       hidden target="_blank" rel="noopener">
      ↓ &nbsp; Download ZIP
    </a>

    <div id="noDownload" class="button disabled">
      Download ZIP link not added
    </div>

    <section class="section" id="castSection" hidden>
      <h3>Cast</h3>
      <div id="cast" class="cast"></div>
    </section>
  </div>
</main>

<script type="module">
import {initializeApp}
from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";

import {
  getFirestore,
  doc,
  getDoc
} from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";

const firebaseConfig={
  apiKey:"AIzaSyB96qkeFLXWMIMvld9jS9SOmbx2g2sJ98",
  authDomain:"cinehub-27129.firebaseapp.com",
  projectId:"cinehub-27129",
  storageBucket:"cinehub-27129.firebasestorage.app",
  messagingSenderId:"564236433071",
  appId:"1:564236433071:web:474301819e114c22bac65a"
};

/* TMDB API Key: paste your existing key here */
const TMDB_API_KEY="PASTE_YOUR_TMDB_API_KEY_HERE";

const db=getFirestore(initializeApp(firebaseConfig));
const $=id=>document.getElementById(id);
const movieId=new URLSearchParams(location.search).get("id");
const CACHE_PREFIX="cinehub_detail_v1_";

function setText(id,value){
  $(id).textContent=value||"";
}

function safeUrl(value){
  try{
    const url=new URL(value);
    return url.protocol==="https:"?url.href:"";
  }catch{
    return "";
  }
}

function showMovie(movie){
  setText("title",movie.title||"Movie");
  setText("year",movie.year||movie.releaseDate||"");
  setText(
    "director",
    movie.director?"Director: "+movie.director:""
  );

  if(movie.poster){
    $("poster").src=movie.poster;
    $("poster").hidden=false;
  }else{
    $("poster").hidden=true;
  }

  const zip=safeUrl(movie.downloadZip||movie.zipUrl||"");
  $("download").hidden=!zip;
  $("download").href=zip;
  $("noDownload").hidden=!!zip;

  $("content").hidden=false;
  $("status").textContent="";
  document.title=(movie.title||"Movie")+" - CineHub";
}

function renderCast(people){
  const cast=$("cast");
  cast.replaceChildren();
  let count=0;

  (people||[]).forEach(person=>{
    const name=typeof person==="string"
      ?person:person.name;

    if(!name)return;

    const item=document.createElement("div");
    item.className="person";

    const img=document.createElement("img");
    img.alt=name;
    img.loading="lazy";

    const path=typeof person==="object"
      ?person.profilePath||person.profile_path||""
      :"";

    if(path){
      img.src=path.startsWith("http")
        ?path
        :"https://image.tmdb.org/t/p/w185"+path;
    }else{
      img.hidden=true;
    }

    const label=document.createElement("p");
    label.textContent=name;

    item.append(img,label);
    cast.append(item);
    count++;
  });

  $("castSection").hidden=count===0;
}

async function loadCast(movie){
  if(
    !movie.tmdbId||
    !TMDB_API_KEY||
    TMDB_API_KEY==="PASTE_YOUR_TMDB_API_KEY_HERE"
  ){
    renderCast(movie.cast||[]);
    return;
  }

  try{
    const response=await fetch(
      "https://api.themoviedb.org/3/movie/"+
      encodeURIComponent(movie.tmdbId)+
      "/credits?api_key="+encodeURIComponent(TMDB_API_KEY)
    );

    if(!response.ok)throw new Error("TMDB credits failed");

    const data=await response.json();

    const people=(data.cast||[]).slice(0,20).map(person=>({
      name:person.name,
      profilePath:person.profile_path
        ?"https://image.tmdb.org/t/p/w185"+person.profile_path
        :""
    }));

    renderCast(people);

  }catch(error){
    console.error("Cast loading error:",error);
    renderCast(movie.cast||[]);
  }
}

async function loadMovie(){
  if(!movieId){
    $("status").textContent="Movie ID is missing.";
    return;
  }

  /* Show cached movie immediately when available */
  try{
    const cached=localStorage.getItem(CACHE_PREFIX+movieId);

    if(cached){
      const movie=JSON.parse(cached);
      showMovie(movie);
      renderCast(movie.cast||[]);
    }
  }catch(error){
    console.warn("Cache read error:",error);
  }

  try{
    const snapshot=await getDoc(doc(db,"movies",movieId));

    if(!snapshot.exists()){
      if($("content").hidden){
        $("status").textContent="Movie not found.";
      }
      return;
    }

    const movie={
      ...snapshot.data(),
      documentId:snapshot.id
    };

    try{
      localStorage.setItem(
        CACHE_PREFIX+movieId,
        JSON.stringify(movie)
      );
    }catch(error){}

    showMovie(movie);
    await loadCast(movie);

  }catch(error){
    console.error("Movie loading error:",error);

    if($("content").hidden){
      $("status").textContent=
        "Could not load movie. Check internet and Firestore rules.";
    }
  }
}

loadMovie();
</script>

</body>
</html>
