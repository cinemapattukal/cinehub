
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CineHub</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #101010;
      color: white;
      font-family: Arial, sans-serif;
    }
    header {
      padding: 22px 5%;
      background: #181818;
      border-bottom: 1px solid #333;
    }
    header h1 { margin: 0; color: #1ed760; }
    main { padding: 25px 5%; }
    input {
      width: 100%;
      padding: 14px;
      border: 1px solid #444;
      border-radius: 8px;
      background: #222;
      color: white;
      font-size: 16px;
    }
    .welcome {
      margin-top: 35px;
      padding: 25px;
      background: #202020;
      border-radius: 12px;
    }
  </style>
</head>
<body>
  <header><h1>CineHub</h1></header>
  <main>
    <input type="search" placeholder="Search movies...">
    <section class="welcome">
      <h2>Welcome to CineHub</h2>
      <p>Your movie website starts here.</p>
    </section>
  </main>
</body>
</html>
