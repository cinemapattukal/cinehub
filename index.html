
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CineHub - Movies</title>

<style>
*{box-sizing:border-box}
body{margin:0;background:#101010;color:#fff;font-family:Arial,sans-serif}
header{position:sticky;top:0;z-index:10;padding:18px 5%;background:#181818;border-bottom:1px solid #303030}
.site-header{display:flex;align-items:center;justify-content:space-between;gap:12px}
header h1{margin:0;color:#1ed760;font-size:28px}
.account-actions{display:flex;align-items:center;gap:8px;min-width:0}
.account-btn{border:0;border-radius:999px;padding:9px 13px;background:#1ed760;color:#111;font-size:13px;font-weight:700;white-space:nowrap;cursor:pointer}
.account-logout{background:#292929;color:#fff}
.account-user{max-width:130px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#bbb;font-size:12px}
.account-modal[hidden]{display:none!important}
.account-modal{position:fixed;inset:0;z-index:2000;display:flex;align-items:center;justify-content:center;padding:16px;font-family:Arial,sans-serif}
.account-backdrop{position:absolute;inset:0;background:rgba(0,0,0,.78)}
.account-card{position:relative;width:min(420px,100%);max-height:calc(100dvh - 32px);overflow:auto;padding:24px;background:#181818;color:#fff;border:1px solid #383838;border-radius:16px;box-shadow:0 20px 80px #0009}
.account-close{position:absolute;top:10px;right:10px;width:36px;height:36px;border:0;border-radius:50%;background:#303030;color:#fff;font-size:24px;cursor:pointer}
.account-logo{display:inline-block;margin-bottom:14px;color:#1ed760;font-size:22px;font-weight:800;text-decoration:none}
.account-card h2{margin:0 0 6px;font-size:23px}
.account-subtitle{margin:0 0 18px;color:#aaa;font-size:14px}
.account-tabs{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:16px;padding:4px;background:#101010;border-radius:9px}
.account-tabs button{border:0;border-radius:7px;padding:10px;background:transparent;color:#bbb;font-weight:700;cursor:pointer}
.account-tabs button.selected{background:#1ed760;color:#111}
#accountForm{display:grid;gap:12px}
#accountForm label{display:grid;gap:6px;color:#eee;font-size:13px;font-weight:600}
#accountForm input{width:100%;min-height:44px;padding:10px 12px;border:1px solid #444;border-radius:8px;background:#101010;color:#fff;font-size:16px}
.account-submit{min-height:44px;border:0;border-radius:8px;background:#1ed760;color:#111;font-weight:800;cursor:pointer}
#accountMessage{min-height:18px;margin:0;color:#ffb8c0;font-size:13px;overflow-wrap:anywhere}
.account-admin-link{margin-top:16px;padding-top:13px;border-top:1px solid #383838;color:#aaa;text-align:center;font-size:13px}
.account-admin-link a{color:#1ed760;font-weight:700;text-decoration:none}
@media(max-width:420px){.site-header{padding:14px 4%;}.account-btn{padding:8px 10px;font-size:12px}.account-user{max-width:85px}}
main{padding:20px 5%;max-width:1600px;margin:auto}
#search{width:100%;padding:14px 18px;margin-bottom:22px;border:1px solid #444;border-radius:25px;background:#252525;color:#fff;font-size:16px;outline:none}
#search:focus{border-color:#1ed760}
h2{margin:8px 0 20px;font-size:23px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.card{min-width:0;cursor:pointer}
.poster{display:block;width:100%;aspect-ratio:2/3;object-fit:cover;border-radius:9px;background:#222}
.card h3{margin:9px 0 5px;font-size:14px;line-height:1.4;overflow-wrap:anywhere}
.year{margin-bottom:6px;color:#aaa;font-size:13px}
#status{color:#bbb;font-size:14px;margin:18px 0}
#retry{display:none;margin:12px 0;padding:12px 20px;border:0;border-radius:7px;background:#1ed760;color:#111;font-weight:bold;cursor:pointer}
footer{padding:25px;margin-top:35px;border-top:1px solid #303030;color:#888;text-align:center;font-size:13px}
@media(min-width:700px){
 .grid{grid-template-columns:repeat(5,minmax(0,1fr));gap:20px}
 header h1{font-size:32px}
 .card h3{font-size:15px}
}
</style>
</head>

<body>
<header class="site-header">
  <h1>CineHub</h1>
  <div class="account-actions">
    <button id="accountOpenBtn" class="account-btn" type="button">Login / Register</button>
    <span id="accountUserLabel" class="account-user" hidden></span>
    <button id="accountLogoutBtn" class="account-btn account-logout" type="button" hidden>Log out</button>
  </div>
</header>

<main>
  <input id="search" type="search"
    placeholder="Search added movies..." aria-label="Search movies">

  <h2>Movies</h2>
  <p id="status" role="status" aria-live="polite"></p>
  <button id="retry" type="button">Reconnect</button>
  <div id="movies" class="grid"></div>
</main>

<footer>CineHub</footer>

<script type="module">
import {initializeApp}
from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";

import {
  getFirestore,
  collection,
  onSnapshot
} from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";

/* Firebase configuration */
const firebaseConfig = {
  apiKey: "AIzaSyB96qkeFLXWMIMvld9jS9SOmbx2g2sJ98",
  authDomain: "cinehub-27129.firebaseapp.com",
  projectId: "cinehub-27129",
  storageBucket: "cinehub-27129.firebasestorage.app",
  messagingSenderId: "564236433071",
  appId: "1:564236433071:web:474301819e114c22bac65a"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const grid = document.getElementById("movies");
const status = document.getElementById("status");
const search = document.getElementById("search");
const retry = document.getElementById("retry");

const CACHE_KEY = "cinehub_movies_cache_v1";

let allMovies = [];
let loaded = false;
let unsubscribeMovies = null;

function readCache(){
  try{
    const raw = localStorage.getItem(CACHE_KEY);
    if(!raw) return null;

    const data = JSON.parse(raw);
    return Array.isArray(data) ? data : null;
  }catch(error){
    return null;
  }
}

function saveCache(movies){
  try{
    localStorage.setItem(CACHE_KEY,JSON.stringify(movies));
  }catch(error){
    console.warn("Cache unavailable:",error);
  }
}

function renderMovies(){
  const query = search.value.trim().toLowerCase();

  const filtered = allMovies.filter(movie =>
    (movie.title || "").toLowerCase().includes(query)
  );

  grid.replaceChildren();

  if(!filtered.length){
    status.textContent = query
      ? "No matching movies found."
      : "No movies added yet. Add movies through Admin.";
    return;
  }

  status.textContent = "";
  retry.style.display = "none";

  filtered.forEach(movie => {
    const card = document.createElement("article");
    card.className = "card";
    card.tabIndex = 0;
    card.setAttribute("role","link");
    card.setAttribute("aria-label","View "+(movie.title||"movie")+" details");

    if(movie.poster){
      const img = document.createElement("img");
      img.className = "poster";
      img.src = movie.poster;
      img.alt = (movie.title || "Movie") + " poster";
      img.loading = "lazy";

      img.onerror = () => {
        img.style.visibility = "hidden";
      };

      card.appendChild(img);
    }else{
      const placeholder = document.createElement("div");
      placeholder.className = "poster";
      card.appendChild(placeholder);
    }

    const title = document.createElement("h3");
    title.textContent = movie.title || "Untitled";

    const year = document.createElement("div");
    year.className = "year";
    year.textContent = movie.year || "";

    card.append(title,year);

    function openDetails(){
      /* Cache selected movie before navigation for instant details */
      try{
        localStorage.setItem(
          "cinehub_detail_v1_" + movie.documentId,
          JSON.stringify(movie)
        );
      }catch(error){
        console.warn("Could not cache selected movie:", error);
      }
      const detailsUrl = new URL("movie.html", window.location.href);
      detailsUrl.searchParams.set("id", movie.documentId);
      window.location.href = detailsUrl.href;
    }

    card.addEventListener("click",openDetails);
    card.addEventListener("keydown",event=>{
      if(event.key==="Enter" || event.key===" "){
        event.preventDefault();
        openDetails();
      }
    });

    grid.appendChild(card);
  });
}

/* Show cached movies immediately */
const cachedMovies = readCache();

if(cachedMovies !== null){
  allMovies = cachedMovies;
  loaded = true;
  renderMovies();
}

/* Live updates when Admin adds or deletes movies */
function loadMovies(){
  retry.style.display = "none";

  if(unsubscribeMovies){
    unsubscribeMovies();
    unsubscribeMovies = null;
  }

  unsubscribeMovies = onSnapshot(
    collection(db,"movies"),

    snapshot => {
      allMovies = snapshot.docs.map(document => ({
        ...document.data(),
        documentId: document.id
      }));

      allMovies.sort((a,b) =>
        (b.updatedAt || "").localeCompare(a.updatedAt || "")
      );

      loaded = true;
      saveCache(allMovies);
      renderMovies();
    },

    error => {
      console.error("Firestore listener error:",error);

      if(!loaded){
        grid.replaceChildren();
        status.textContent =
          "Could not load movies. Check Firestore rules and connection.";
      }else{
        status.textContent =
          "Connection interrupted. Showing available movies.";
      }

      retry.style.display = "inline-block";
    }
  );
}

search.addEventListener("input",()=>{
  if(loaded) renderMovies();
});

retry.addEventListener("click",loadMovies);

loadMovies();
</script>

<div id="accountModal" class="account-modal" hidden>
  <div class="account-backdrop" data-account-close="true"></div>
  <section class="account-card" role="dialog" aria-modal="true" aria-labelledby="accountTitle">
    <button id="accountCloseBtn" class="account-close" type="button" aria-label="Close">×</button>
    <a class="account-logo" href="./">CineHub</a>
    <h2 id="accountTitle">Welcome to CineHub</h2>
    <p class="account-subtitle">Sign in or create your free account.</p>
    <div class="account-tabs">
      <button id="accountLoginTab" type="button" class="selected">Login</button>
      <button id="accountRegisterTab" type="button">Register</button>
    </div>
    <form id="accountForm">
      <label id="accountNameWrap" hidden>Full name
        <input id="accountName" type="text" maxlength="80" autocomplete="name" placeholder="Your name">
      </label>
      <label>Email
        <input id="accountEmail" type="email" autocomplete="email" required placeholder="you@example.com">
      </label>
      <label>Password
        <input id="accountPassword" type="password" minlength="6" autocomplete="current-password" required placeholder="At least 6 characters">
      </label>
      <button id="accountSubmitBtn" class="account-submit" type="submit">Login</button>
      <p id="accountMessage" role="status" aria-live="polite"></p>
    </form>
    <div class="account-admin-link">Admin? <a href="./admin.html">Open Admin Login</a></div>
  </section>
</div>
<script type="module" src="auth.js"></script>

</body>
</html>
